<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

    body {
      font-family: 'Roboto', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      overflow: hidden;
      transition: background 1s ease;
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 500px;
      width: 100%;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 1s forwards;
    }

    h1, h2, p {
      color: #333;
    }

    button {
      margin: 0.5rem;
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #ff6f61;
      color: white;
      transition: background 0.3s ease, transform 0.2s;
    }

    button:hover {
      background: #ff3e2d;
      transform: scale(1.05);
    }

    #clue, #answer {
      margin-top: 1rem;
      font-size: 1.2rem;
    }

    #clue {
      color: #007bff;
    }

    #answer {
      color: #28a745;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container" id="startPage">
    <h1>🎉 Welcome to the Quiz Game 🎉</h1>
    <button onclick="startGame()">Start</button>
  </div>

  <div class="container hidden" id="questionPage">
    <h2 id="questionText"></h2>
    <div>
      <button onclick="showClue()">Clue</button>
      <button onclick="showAnswer()">Show Answer</button>
      <button onclick="nextQuestion()">Next</button>
    </div>
    <p id="clue"></p>
    <p id="answer"></p>
  </div>

  <div class="container hidden" id="endPage">
    <h2>🎊 Thank you for playing! 🎊</h2>
    <button onclick="restartGame()">Play Again</button>
  </div>

  <script>
    const questions = [
      { text: "All managers have a_t__ skills", clue: "CYNLTAALIA", answer: "Analytical" },
      { text: "Your office colleagues are s_a_", clue: "TSRAM", answer: "Smart" },
      { text: "LinkedIn is world's biggest __in_ platform", clue: "WRENTGKOIN", answer: "Networking" },
      { text: "Employees release stress through an_____", clue: "TURNEVDAE", answer: "Adventure" },
      { text: "Appraisals are based on p_____", clue: "FORMEPRECAN", answer: "Performance" },
      { text: "HR checks your r_m__before hiring", clue: "SUREME", answer: "Resume" },
      { text: "For promotion, you need m_iai___", clue: "VTIOITAMON", answer: "Motivation" },
      { text: "Hardwork increases s_r_", clue: "LRAASY", answer: "Salary" },
      { text: "Corporate Growth is based on F_______", clue: "BCKAFEDE", answer: "Feedback" },
      { text: "Your Colleagues are great M__r", clue: "TRONEM", answer: "Mentor" }
    ];

    let currentQuestion = 0;

    function startGame() {
      currentQuestion = 0;
      transitionPages("startPage", "questionPage");
      loadQuestion();
    }

    function loadQuestion() {
      const q = questions[currentQuestion];
      document.getElementById("questionText").innerText = q.text;
      document.getElementById("clue").innerText = "";
      document.getElementById("answer").innerText = "";
    }

    function showClue() {
      const q = questions[currentQuestion];
      document.getElementById("clue").innerText = "Clue: " + q.clue;
    }

    function showAnswer() {
      const q = questions[currentQuestion];
      document.getElementById("answer").innerText = "Answer: " + q.answer;
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        animateQuestionChange();
        loadQuestion();
      } else {
        transitionPages("questionPage", "endPage");
      }
    }

    function restartGame() {
      transitionPages("endPage", "startPage");
    }

    function transitionPages(hideId, showId) {
      document.getElementById(hideId).classList.add("hidden");
      const showEl = document.getElementById(showId);
      showEl.classList.remove("hidden");
      showEl.style.animation = "none";
      showEl.offsetHeight; // reflow
      showEl.style.animation = null;
    }

    function animateQuestionChange() {
      const container = document.getElementById("questionPage");
      container.style.animation = "none";
      container.offsetHeight;
      container.style.animation = null;
    }
  </script>
</body>
</html>
