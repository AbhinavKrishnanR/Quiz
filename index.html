<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

    body {
      font-family: 'Roboto', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      overflow: hidden;
      transition: background 1s ease;
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 500px;
      width: 100%;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 1s forwards;
    }

    h1, h2 {
      color: #333;
    }

    button {
      margin: 1rem;
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #ff6f61;
      color: white;
      transition: background 0.3s ease, transform 0.2s;
    }

    button:hover {
      background: #ff3e2d;
      transform: scale(1.05);
    }

    #clue {
      margin-top: 1rem;
      color: #007bff;
      font-size: 1.2rem;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container" id="startPage">
    <h1>🎉 Welcome to the Quiz Game 🎉</h1>
    <button onclick="startGame()">Start</button>
  </div>

  <div class="container hidden" id="questionPage">
    <h2 id="questionText"></h2>
    <div>
      <button onclick="showClue()">Clue</button>
      <button onclick="nextQuestion()">Next</button>
    </div>
    <p id="clue"></p>
  </div>

  <div class="container hidden" id="endPage">
    <h2>🎊 Thank you for playing! 🎊</h2>
    <button onclick="restartGame()">Play Again</button>
  </div>

  <script>
    const questions = [
      {
        text: "All managers have __________ skills.",
        clue: "ATCGNI"
      },
      {
        text: "Leaders must possess __________ thinking abilities.",
        clue: "VITISNAO"
      },
      {
        text: "Effective communication is __________ in management.",
        clue: "ETIANKSR"
      }
    ];

    let currentQuestion = 0;

    function startGame() {
      currentQuestion = 0;
      transitionPages("startPage", "questionPage");
      loadQuestion();
    }

    function loadQuestion() {
      const q = questions[currentQuestion];
      document.getElementById("questionText").innerText = q.text;
      document.getElementById("clue").innerText = "";
    }

    function showClue() {
      const q = questions[currentQuestion];
      document.getElementById("clue").innerText = q.clue;
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        animateQuestionChange();
        loadQuestion();
      } else {
        transitionPages("questionPage", "endPage");
      }
    }

    function restartGame() {
      transitionPages("endPage", "startPage");
    }

    function transitionPages(hideId, showId) {
      document.getElementById(hideId).classList.add("hidden");
      const showEl = document.getElementById(showId);
      showEl.classList.remove("hidden");
      showEl.style.animation = "none";
      showEl.offsetHeight; // reflow
      showEl.style.animation = null;
    }

    function animateQuestionChange() {
      const container = document.getElementById("questionPage");
      container.style.animation = "none";
      container.offsetHeight;
      container.style.animation = null;
    }
  </script>
</body>
</html>
